# Supabase CLI project config. Generated for the CLI-based migration
# workflow (see .github/workflows/db-migrations.yml and
# docs/MIGRATION_RUNBOOK.md) — most sections below only matter if someone
# also runs `supabase start` for a local Postgres stack; `supabase link` +
# `supabase db push` (what CI uses) only need `project_id` and the
# `[db]` section.
#
# Full reference: https://supabase.com/docs/guides/local-development/cli/config

project_id = "growfit"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Match this to the live project's Postgres version (Project Settings >
# Database > Configuration). 15 is the current default for new projects.
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "oneshot"
