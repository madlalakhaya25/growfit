# SonarCloud automatic analysis settings.
#
# database.types.ts is generated from the live Supabase schema
# (`npm run db:types` in web/) and repeats the same Row / Insert / Update
# shape for every table, so it is left out of analysis and duplication.
sonar.exclusions=web/src/lib/database.types.ts
sonar.cpd.exclusions=web/src/lib/database.types.ts
