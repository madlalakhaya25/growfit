# Automated PR review, via The-PR-Agent (Apache-2.0, community-governed as
# of April 2026 — github.com/The-PR-Agent/pr-agent), run twice per PR
# against two independent models:
#
#   - Gemini, reusing this app's own GEMINI_API_KEY and model id
#     (src/lib/ai-models.ts) rather than adding a second Google account.
#     NOTE: shares quota/billing with the app's live AI features — give it
#     a separate key if that's ever a problem.
#   - "openrouter/free" — OpenRouter's own auto-router
#     (openrouter.ai/openrouter/free), which randomly picks a currently-free
#     model matching the request's needs, rather than a specific named
#     model. See below for why this replaced a hardcoded slug.
#
# Each posts a narrative review comment plus inline suggestions ("improve").
# This is advisory, not the merge gate — pr-checks.yml is the required
# check.
#
# ── Why the second reviewer routes through openrouter/free instead of a
# named model ──────────────────────────────────────────────────────────────
# The original plan was Qwen2.5-Coder specifically (strong coding
# benchmarks, and OpenRouter listed a free slug for it). Three real,
# distinct pr-agent bugs were found and fixed getting it working — all
# instructive, all already applied to the Gemini job above too:
#
#   1. pr-agent 0.45.0's CLI rejects `--config.model=...` (and
#      `--config.git_provider`, `--github.deployment_type`,
#      `--config.github_user_token`) as "unrecognized arguments" — exit 2,
#      dumps its own --help. `continue-on-error: true` was turning that
#      repeated failure into a "successful" job that had posted nothing to
#      the PR at all, across roughly twenty commits before this was
#      actually diagnosed from real job logs instead of a trusted green
#      checkmark. Fix: `--extra_config_url` IS a real, accepted top-level
#      flag (confirmed in the tool's own --help) that merges an extra
#      .pr_agent.toml — a URL or local filesystem path — before any
#      repo-local config.
#   2. pr-agent's default deployment_type is "user", and in that mode it
#      reads the GitHub token from the *config* key github.user_token —
#      not the ambient GITHUB_TOKEN env var, even with that set. Fix: each
#      job's TOML also sets [github] user_token, expanded from the real
#      GITHUB_TOKEN value at write time.
#   3. pr-agent keeps a hardcoded table of known models' max token counts
#      and refuses to call anything missing from it. Fix:
#      custom_model_max_tokens set explicitly for any model not already in
#      that table (Gemini's is; openrouter/free's isn't, so its job sets
#      one).
#
# All three fixes worked. What actually killed the named-Qwen-slug approach
# was external: OpenRouter's own API returned "This model is unavailable
# for free. The paid version is available now" — they discontinued the free
# tier for Qwen-coder models entirely, between when this was planned and
# when it was tested against a real PR (#5). Chasing OpenRouter's free-tier
# rotation by hand isn't sustainable, so the second reviewer now routes
# through their own auto-router instead of a named model — it always
# resolves to whatever's currently free, so a future free-tier reshuffle
# doesn't silently break this job the same way again. The tradeoff: which
# specific model answers varies call to call, which is fine for "a second
# opinion" but means don't expect it to always be the same model twice.
#
# continue-on-error is deliberately NOT used here — that's exactly what hid
# every failure above. Let a real failure show up red.
#
# Each review/suggest step has timeout-minutes: 5 — a real run against
# openrouter/free hung for 7+ minutes on a single call with no output
# (almost certainly an overloaded free-tier backend the router picked, not
# a bug here) before it was manually cancelled. Free-tier capacity is
# shared and unpredictable; a slow or unresponsive backend should fail this
# one advisory job fast and visibly, not tie up a runner indefinitely.

name: PR Agent Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]

concurrency:
  group: pr-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gemini-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Check for Gemini key
        id: key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Gemini review skipped::GEMINI_API_KEY is not set as a repo secret (Settings > Secrets and variables > Actions)."
          fi

      - uses: actions/setup-python@v5
        if: steps.key.outputs.available == 'true'
        with:
          python-version: "3.12"

      - name: Install pr-agent
        if: steps.key.outputs.available == 'true'
        run: pip install pr-agent

      - name: Write pr-agent config
        if: steps.key.outputs.available == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > "$RUNNER_TEMP/pr_agent_gemini.toml" <<EOF
          [config]
          model="gemini/gemini-3.6-flash"
          fallback_models=[]

          [github]
          user_token="$GITHUB_TOKEN"
          EOF

      - name: Review (Gemini)
        if: steps.key.outputs.available == 'true'
        timeout-minutes: 5
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr-agent \
            --pr_url="${{ github.event.pull_request.html_url }}" \
            --extra_config_url="$RUNNER_TEMP/pr_agent_gemini.toml" \
            review \
            --pr_reviewer.extra_instructions="Sign off as 'Gemini Flash' so it's clear which reviewer this is."

      - name: Suggestions (Gemini)
        if: steps.key.outputs.available == 'true'
        timeout-minutes: 5
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr-agent \
            --pr_url="${{ github.event.pull_request.html_url }}" \
            --extra_config_url="$RUNNER_TEMP/pr_agent_gemini.toml" \
            improve

  openrouter-free-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Check for OpenRouter key
        id: key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "$OPENROUTER_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=OpenRouter review skipped::OPENROUTER_API_KEY is not set. Add a free OpenRouter key (openrouter.ai) as a repo secret to enable this reviewer."
          fi

      - uses: actions/setup-python@v5
        if: steps.key.outputs.available == 'true'
        with:
          python-version: "3.12"

      - name: Install pr-agent
        if: steps.key.outputs.available == 'true'
        run: pip install pr-agent

      - name: Write pr-agent config
        if: steps.key.outputs.available == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > "$RUNNER_TEMP/pr_agent_openrouter.toml" <<EOF
          [config]
          model="openrouter/free"
          fallback_models=[]
          # openrouter/free is an auto-router alias, not a named model pr-agent
          # would have hardcoded a token limit for. Its documented context
          # window is 200000 (openrouter.ai/openrouter/free).
          custom_model_max_tokens=200000

          [github]
          user_token="$GITHUB_TOKEN"
          EOF

      - name: Review (OpenRouter free-tier router)
        if: steps.key.outputs.available == 'true'
        timeout-minutes: 5
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr-agent \
            --pr_url="${{ github.event.pull_request.html_url }}" \
            --extra_config_url="$RUNNER_TEMP/pr_agent_openrouter.toml" \
            review \
            --pr_reviewer.extra_instructions="Sign off as 'OpenRouter free-tier router' so it's clear which reviewer this is, and that the exact underlying model may vary between runs."

      - name: Suggestions (OpenRouter free-tier router)
        if: steps.key.outputs.available == 'true'
        timeout-minutes: 5
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr-agent \
            --pr_url="${{ github.event.pull_request.html_url }}" \
            --extra_config_url="$RUNNER_TEMP/pr_agent_openrouter.toml" \
            improve
