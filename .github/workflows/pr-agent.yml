# Automated PR review, via The-PR-Agent (Apache-2.0, community-governed as
# of April 2026 — github.com/The-PR-Agent/pr-agent), run against Gemini,
# reusing this app's own GEMINI_API_KEY and model id (src/lib/ai-models.ts)
# rather than adding a second Google account. NOTE: shares quota/billing
# with the app's live AI features — give it a separate key if that's ever
# a problem.
#
# Posts a narrative review comment plus inline suggestions ("improve").
# This is advisory, not the merge gate — pr-checks.yml is the required
# check.
#
# Getting this working cost about twenty commits of trial and error on a
# real PR (#5) before the real causes were found by reading actual job
# logs instead of trusting a green checkmark — three real, distinct
# pr-agent 0.45.0 bugs:
#
#   1. Its CLI rejects `--config.model=...` (and `--config.git_provider`,
#      `--github.deployment_type`, `--config.github_user_token`) as
#      "unrecognized arguments" — exit 2, dumps its own --help.
#      `continue-on-error: true` was turning that repeated failure into a
#      "successful" job that had posted nothing to the PR at all. Fix:
#      `--extra_config_url` IS a real, accepted top-level flag (confirmed
#      in the tool's own --help) that merges an extra .pr_agent.toml — a
#      URL or local filesystem path — before any repo-local config.
#   2. Its default deployment_type is "user", and in that mode it reads
#      the GitHub token from the *config* key github.user_token — not the
#      ambient GITHUB_TOKEN env var, even with that set. Fix: the job's
#      TOML also sets [github] user_token, expanded from the real
#      GITHUB_TOKEN value at write time.
#   3. It keeps a hardcoded table of known models' max token counts and
#      refuses to call anything missing from it (Gemini's is already in
#      that table, so no override is needed here).
#
# continue-on-error is deliberately NOT used here — that's exactly what hid
# every failure above. Let a real failure show up red.
#
# Each review/suggest step has timeout-minutes: 5 so a slow or
# unresponsive backend fails this one advisory job fast and visibly,
# rather than tying up a runner indefinitely.

name: PR Agent Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]

concurrency:
  group: pr-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gemini-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Check for Gemini key
        id: key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Gemini review skipped::GEMINI_API_KEY is not set as a repo secret (Settings > Secrets and variables > Actions)."
          fi

      - uses: actions/setup-python@v5
        if: steps.key.outputs.available == 'true'
        with:
          python-version: "3.12"

      - name: Install pr-agent
        if: steps.key.outputs.available == 'true'
        run: pip install pr-agent

      - name: Write pr-agent config
        if: steps.key.outputs.available == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > "$RUNNER_TEMP/pr_agent_gemini.toml" <<EOF
          [config]
          model="gemini/gemini-3.6-flash"
          fallback_models=[]

          [github]
          user_token="$GITHUB_TOKEN"
          EOF

      - name: Review (Gemini)
        if: steps.key.outputs.available == 'true'
        timeout-minutes: 5
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr-agent \
            --pr_url="${{ github.event.pull_request.html_url }}" \
            --extra_config_url="$RUNNER_TEMP/pr_agent_gemini.toml" \
            review \
            --pr_reviewer.extra_instructions="Sign off as 'Gemini Flash' so it's clear which reviewer this is."

      - name: Suggestions (Gemini)
        if: steps.key.outputs.available == 'true'
        timeout-minutes: 5
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr-agent \
            --pr_url="${{ github.event.pull_request.html_url }}" \
            --extra_config_url="$RUNNER_TEMP/pr_agent_gemini.toml" \
            improve
