# Automated PR review, via The-PR-Agent (Apache-2.0, community-governed as
# of April 2026 — github.com/The-PR-Agent/pr-agent), backed by Gemini —
# reusing this app's own GEMINI_API_KEY and model id (src/lib/ai-models.ts)
# rather than adding a second Google account. NOTE: this shares
# quota/billing with the app's live AI features — give it a separate key
# if that's ever a problem.
#
# Posts a narrative review comment plus separate, individually resolvable
# inline suggestion threads ("improve"). This is advisory, not the merge
# gate — pr-checks.yml is the required check.
#
# ── A second reviewer (Qwen2.5-Coder via OpenRouter's free tier) was tried
# and deliberately dropped ─────────────────────────────────────────────────
# The plan was two independent models per PR — Qwen specifically because it
# scores well above Gemini Flash on coding-specific benchmarks, and
# OpenRouter listed a free slug for it. Three real, distinct bugs were found
# and fixed getting there (all instructive, all applicable to the Gemini
# job below too):
#
#   1. pr-agent 0.45.0's CLI rejects `--config.model=...` (and
#      `--config.git_provider`, `--github.deployment_type`,
#      `--config.github_user_token`) as "unrecognized arguments" — exit 2,
#      dumps its own --help. `continue-on-error: true` was turning that
#      repeated failure into a "successful" job that had posted nothing to
#      the PR at all, across roughly twenty commits before this was
#      actually diagnosed from real job logs instead of a trusted green
#      checkmark. Fix: `--extra_config_url` IS a real, accepted top-level
#      flag (confirmed in the tool's own --help) that merges an extra
#      .pr_agent.toml — a URL or local filesystem path — before any
#      repo-local config. No repo-local .pr_agent.toml exists here, so
#      nothing overrides these per-job files.
#   2. pr-agent's default deployment_type is "user", and in that mode it
#      reads the GitHub token from the *config* key github.user_token —
#      not the ambient GITHUB_TOKEN env var, even with that set. Fix: each
#      job's TOML also sets [github] user_token, expanded from the real
#      GITHUB_TOKEN value at write time.
#   3. pr-agent keeps a hardcoded table of known models' max token counts
#      and refuses to call anything missing from it. Fix (Qwen-specific,
#      since Gemini's model is already in that table):
#      custom_model_max_tokens set explicitly.
#
# All three fixes worked — the CLI, auth, and token-limit problems were
# real but ours to fix. What killed the Qwen job was external: OpenRouter's
# own API returned "This model is unavailable for free. The paid version is
# available now" — they'd pulled the free tier for this model (and for
# Qwen-coder generally) between when this was planned and when it was
# tested against a real PR. Rather than chase OpenRouter's free-model
# rotation indefinitely, shipped with Gemini alone — proven working
# end-to-end (real review, real inline suggestions, on this repo's own
# PR #5) and zero additional cost or dependency.
#
# continue-on-error is deliberately NOT used here — that's exactly what hid
# every failure above. Let a real failure show up red.

name: PR Agent Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]

concurrency:
  group: pr-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gemini-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Check for Gemini key
        id: key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Gemini review skipped::GEMINI_API_KEY is not set as a repo secret (Settings > Secrets and variables > Actions)."
          fi

      - uses: actions/setup-python@v5
        if: steps.key.outputs.available == 'true'
        with:
          python-version: "3.12"

      - name: Install pr-agent
        if: steps.key.outputs.available == 'true'
        run: pip install pr-agent

      - name: Write pr-agent config
        if: steps.key.outputs.available == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > "$RUNNER_TEMP/pr_agent_gemini.toml" <<EOF
          [config]
          model="gemini/gemini-3.6-flash"
          fallback_models=[]

          [github]
          user_token="$GITHUB_TOKEN"
          EOF

      - name: Review (Gemini)
        if: steps.key.outputs.available == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr-agent \
            --pr_url="${{ github.event.pull_request.html_url }}" \
            --extra_config_url="$RUNNER_TEMP/pr_agent_gemini.toml" \
            review \
            --pr_reviewer.extra_instructions="Sign off as 'Gemini Flash' so it's clear which reviewer this is."

      - name: Suggestions (Gemini)
        if: steps.key.outputs.available == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr-agent \
            --pr_url="${{ github.event.pull_request.html_url }}" \
            --extra_config_url="$RUNNER_TEMP/pr_agent_gemini.toml" \
            improve
