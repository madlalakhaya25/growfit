# Applies supabase/migrations/*.sql to the live Supabase project
# automatically, replacing the previous manual step (paste each file into
# the Supabase SQL Editor by hand — see web/CLAUDE.md's "Migrations are
# checked in, not applied" gotcha and docs/MIGRATION_RUNBOOK.md).
#
# Runs on every push to `main` that touches supabase/migrations/**, and can
# also be triggered by hand (Actions tab > Deploy Database Migrations > Run
# workflow) to re-apply the current migration set on demand.
#
# Requires three repo secrets (Settings > Secrets and variables > Actions)
# before this does anything:
#   SUPABASE_ACCESS_TOKEN  — personal access token: supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   — the project's Postgres password: Project Settings > Database
#   SUPABASE_PROJECT_ID    — the project ref (e.g. abcdefghijklmnopqrst), from the
#                            project's dashboard URL or Project Settings > General
#
# Without them the job fails fast with a clear message rather than silently
# no-op'ing — a "green but nothing happened" run would recreate exactly the
# problem this workflow exists to fix. `supabase db push` applies every
# migration the target database hasn't seen yet, in order, so the first run
# after the secrets are added also clears any backlog of already-checked-in
# migrations (see docs/MIGRATION_RUNBOOK.md for what's currently pending).

name: Deploy Database Migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch: {}

concurrency:
  group: db-migrations
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required secrets are configured
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          missing=()
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing+=("SUPABASE_ACCESS_TOKEN")
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing+=("SUPABASE_DB_PASSWORD")
          [ -z "$SUPABASE_PROJECT_ID" ] && missing+=("SUPABASE_PROJECT_ID")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing repo secret(s): ${missing[*]}. Add them under Settings > Secrets and variables > Actions, then re-run this workflow. See docs/MIGRATION_RUNBOOK.md for where to find each value."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push
